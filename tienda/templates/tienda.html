<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Marco Sport</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #111;
        }

        /* =====================================
           HEADER
        ===================================== */

        header {
            background: #111;
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }

        .carrito-flotante {
            background: white;
            color: #111;
            border: none;
            border-radius: 25px;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* =====================================
           CONTENEDOR PRINCIPAL
        ===================================== */

        main {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 25px 18px 50px;
        }

        .titulo-seccion {
            margin-bottom: 20px;
        }

        .titulo-seccion h1 {
            margin: 0;
            font-size: 28px;
        }

        /* =====================================
           FILTRO
        ===================================== */

        .filtro-contenedor {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 22px;
        }

        .filtro-orden {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filtro-orden label {
            font-weight: bold;
            font-size: 14px;
        }

        .filtro-orden select {
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        /* =====================================
           PRODUCTOS
        ===================================== */

        .productos {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .producto {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        /* =====================================
           IMAGEN
        ===================================== */

        .contenedor-imagen {
            width: 100%;
            background: #f1f3f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .imagen-producto {
            width: 100%;
            height: 250px;
            object-fit: contain;
            display: block;
        }

        /* =====================================
           INFORMACIÓN
        ===================================== */

        .contenido-producto {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .contenido-producto h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .precio {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        /* =====================================
           TALLAS
        ===================================== */

        .texto-talla {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .selector-talla {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            margin-bottom: 12px;
            font-size: 14px;
        }

        /* =====================================
           BOTONES
        ===================================== */

        .botones-producto {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: auto;
        }

        .boton {
            border: none;
            border-radius: 8px;
            padding: 11px 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-size: 13px;
        }

        .boton-carrito {
            background: #111;
            color: white;
        }

        .boton-carrito:hover {
            background: #333;
        }

        .boton-ver {
            background: #e9ecef;
            color: #111;
        }

        .boton-ver:hover {
            background: #dfe3e6;
        }

        .agotado {
            color: #c62828;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* =====================================
           CARRITO
        ===================================== */

        .fondo-carrito {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 200;
        }

        .fondo-carrito.activo {
            display: block;
        }

        .carrito-panel {
            position: fixed;
            top: 0;
            right: -430px;
            width: min(430px, 100%);
            height: 100vh;
            background: white;
            z-index: 201;
            transition: right 0.3s ease;
            padding: 20px;
            overflow-y: auto;
        }

        .carrito-panel.activo {
            right: 0;
        }

        .cabecera-carrito {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .cabecera-carrito h2 {
            margin: 0;
        }

        .cerrar-carrito {
            border: none;
            background: #eee;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 18px;
        }

        .item-carrito {
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
        }

        .item-carrito strong {
            display: block;
            margin-bottom: 5px;
        }

        .controles-cantidad {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .controles-cantidad button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            background: #eee;
            cursor: pointer;
            font-weight: bold;
        }

        .total-carrito {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .boton-whatsapp {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #25d366;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .carrito-vacio {
            text-align: center;
            color: #777;
            padding: 40px 10px;
        }

        /* =====================================
           TABLET
        ===================================== */

        @media (max-width: 900px) {

            .productos {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

        }

        /* =====================================
           CELULAR
        ===================================== */

        @media (max-width: 600px) {

            header {
                padding: 14px 12px;
            }

            .logo {
                font-size: 21px;
            }

            .carrito-flotante {
                padding: 8px 11px;
                font-size: 13px;
            }

            main {
                padding: 18px 10px 35px;
            }

            .titulo-seccion h1 {
                font-size: 22px;
            }

            .filtro-contenedor {
                justify-content: stretch;
            }

            .filtro-orden {
                width: 100%;
                justify-content: space-between;
            }

            .filtro-orden select {
                flex: 1;
                min-width: 0;
            }

            .productos {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .contenedor-imagen {
                padding: 6px;
            }

            .imagen-producto {
                height: 165px;
            }

            .contenido-producto {
                padding: 10px;
            }

            .contenido-producto h2 {
                font-size: 16px;
                margin-bottom: 5px;
            }

            .precio {
                font-size: 17px;
                margin-bottom: 8px;
            }

            .texto-talla {
                font-size: 12px;
            }

            .selector-talla {
                font-size: 12px;
                padding: 8px;
                margin-bottom: 8px;
            }

            .botones-producto {
                gap: 5px;
            }

            .boton {
                font-size: 11px;
                padding: 9px 4px;
            }

        }

    </style>

</head>


<body>


<header>

    <a
        href="{{ url_for('tienda.inicio') }}"
        class="logo"
    >
        ⚽ Marco Sport
    </a>


    <button
        type="button"
        class="carrito-flotante"
        onclick="abrirCarrito()"
    >

        🛒 Carrito

        <span id="cantidad-carrito">0</span>

    </button>

</header>


<main>


    <div class="titulo-seccion">

        <h1>
            Guayos disponibles
        </h1>

    </div>


    <!-- =====================================
         FILTRO
    ====================================== -->

    <div class="filtro-contenedor">

        <form
            class="filtro-orden"
            method="get"
            action="{{ url_for('tienda.inicio') }}"
        >

            <label for="orden">
                Ordenar por:
            </label>


            <select
                id="orden"
                name="orden"
                onchange="this.form.submit()"
            >

                <option
                    value="recientes"
                    {% if orden == "recientes" %}selected{% endif %}
                >
                    Más recientes
                </option>


                <option
                    value="menor"
                    {% if orden == "menor" %}selected{% endif %}
                >
                    Precio: menor a mayor
                </option>


                <option
                    value="mayor"
                    {% if orden == "mayor" %}selected{% endif %}
                >
                    Precio: mayor a menor
                </option>

            </select>

        </form>

    </div>


    <!-- =====================================
         PRODUCTOS
    ====================================== -->

    <section class="productos">


        {% for producto in productos %}

        <article class="producto">


            <!-- IMAGEN -->

            <div class="contenedor-imagen">

                <img
                    class="imagen-producto"
                    src="{{ producto.foto }}"
                    alt="{{ producto.modelo }}"
                >

            </div>


            <!-- INFORMACIÓN -->

            <div class="contenido-producto">


                <h2>
                    {{ producto.modelo }}
                </h2>


                <div class="precio">
                    ${{ producto.precio }}
                </div>


                {% if producto.tallas_disponibles %}


                    <div class="texto-talla">
                        Talla:
                    </div>


                    <select
                        class="selector-talla"
                        id="talla-{{ producto.id }}"
                    >

                        {% for talla in producto.tallas_disponibles %}

                        <option value="{{ talla }}">
                            Talla {{ talla }}
                        </option>

                        {% endfor %}

                    </select>


                    <div class="botones-producto">


                        <!-- AGREGAR AL CARRITO -->

                        <button
                            type="button"
                            class="boton boton-carrito"
                            onclick='agregarAlCarrito({{ producto.modelo|tojson }}, {{ producto.precio|tojson }}, "talla-{{ producto.id }}")'
                        >
                            🛒 Agregar
                        </button>


                        <!-- VER PRODUCTO -->

                        <a
                            class="boton boton-ver"
                            href="{{ url_for('tienda.ver_producto', producto_id=producto.id) }}"
                        >
                            👀 Ver producto
                        </a>


                    </div>


                {% else %}


                    <div class="agotado">
                        Agotado
                    </div>


                    <a
                        class="boton boton-ver"
                        href="{{ url_for('tienda.ver_producto', producto_id=producto.id) }}"
                    >
                        👀 Ver producto
                    </a>


                {% endif %}


            </div>

        </article>

        {% endfor %}


    </section>


</main>


<!-- =====================================
     FONDO DEL CARRITO
====================================== -->

<div
    id="fondo-carrito"
    class="fondo-carrito"
    onclick="cerrarCarrito()"
></div>


<!-- =====================================
     PANEL DEL CARRITO
====================================== -->

<div
    id="carrito-panel"
    class="carrito-panel"
>


    <div class="cabecera-carrito">

        <h2>
            🛒 Tu carrito
        </h2>


        <button
            type="button"
            class="cerrar-carrito"
            onclick="cerrarCarrito()"
        >
            ×
        </button>

    </div>


    <div id="contenido-carrito">

        <div class="carrito-vacio">
            Tu carrito está vacío.
        </div>

    </div>


    <div
        id="total-carrito"
        class="total-carrito"
    >
        Total: $0
    </div>


    <button
        type="button"
        class="boton-whatsapp"
        onclick="enviarPedido()"
    >
        📲 Comprar por WhatsApp
    </button>


</div>


<script
    src="{{ url_for('tienda.static', filename='tienda.js') }}"
></script>


</body>

</html>
