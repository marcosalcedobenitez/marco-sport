<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marco Sport | Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }

        .login {

            background: white;

            width: 90%;

            max-width: 400px;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

        }

        h1 {

            text-align: center;

            margin-bottom: 5px;

        }

        .subtitulo {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;

        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #009944;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .error {

            background: #ffe5e5;

            color: #c00000;

            padding: 10px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 15px;

        }

        .tienda {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #009944;

            text-decoration: none;

        }

    </style>

</head>

<body>

<div class="login">

    <h1>⚽ Marco Sport</h1>

    <p class="subtitulo">
        Panel de administración
    </p>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        <label>
            Usuario
        </label>

        <input
            type="text"
            name="usuario"
            placeholder="Usuario"
            required
        >

        <label>
            Contraseña
        </label>

        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            🔐 Entrar
        </button>

    </form>

    <a
        class="tienda"
        href="/"
    >
        ← Volver a la tienda
    </a>

</div>

</body>

</html>
