<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marco Sport | Crear administrador</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }

        .contenedor {

            background: white;

            width: 90%;

            max-width: 450px;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

        }

        h1 {

            text-align: center;

            margin-bottom: 5px;

        }

        .subtitulo {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;

        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #009944;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            background: #007a36;

        }

        .error {

            background: #ffe5e5;

            color: #c00000;

            padding: 10px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 15px;

        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>⚽ Marco Sport</h1>

    <p class="subtitulo">
        Configuración inicial del administrador
    </p>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        <label>
            Nombre
        </label>

        <input
            type="text"
            name="nombre"
            placeholder="Tu nombre"
            required
        >

        <label>
            Número de celular
        </label>

        <input
            type="tel"
            name="telefono"
            placeholder="+57 300 000 0000"
            required
        >

        <label>
            Usuario
        </label>

        <input
            type="text"
            name="usuario"
            placeholder="Usuario para iniciar sesión"
            required
        >

        <label>
            Contraseña
        </label>

        <input
            type="password"
            name="password"
            placeholder="Mínimo 6 caracteres"
            required
        >

        <label>
            Confirmar contraseña
        </label>

        <input
            type="password"
            name="confirmar"
            placeholder="Repite la contraseña"
            required
        >

        <button type="submit">
            🔐 Crear administrador
        </button>

    </form>

</div>

</body>

</html>
